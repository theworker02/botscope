[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "botscope"
version = "2.0.0"
description = "Internet-wide bot traffic census with a local measurement workstation and native Qt Observatory."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
  { name = "BotScope Contributors" },
]
keywords = [
  "bots",
  "census",
  "traffic-analysis",
  "observability",
  "classification",
  "network",
  "research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: System :: Networking :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "pydantic>=2.6",
  "rich>=13.7",
  "platformdirs>=4.2",
  "packaging>=24.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6",
  "pyqtgraph>=0.13",
]
capture = [
  "scapy>=2.5",
]
ml = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]
analytics = [
  "duckdb>=1.0",
  "pyarrow>=15.0",
]
network = [
  "httpx>=0.27",
  "cryptography>=42.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]
all = [
  "botscope[gui,capture,ml,analytics,network,dev]",
]

[project.scripts]
botscope = "botscope.cli.main:main"

[project.urls]
Homepage = "https://github.com/theworker02/botscope"
Documentation = "https://github.com/theworker02/botscope#readme"
Repository = "https://github.com/theworker02/botscope"
Issues = "https://github.com/theworker02/botscope/issues"
Changelog = "https://github.com/theworker02/botscope/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/botscope/"

[tool.hatch.build.targets.wheel]
packages = ["src/botscope"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/datasets",
  "/benchmarks",
  "/examples",
  "/research",
  "/signatures",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/LICENSE",
  "/CITATION.cff",
  "/ENGINEERING_REPORT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "network: tests that perform live Internet requests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
packages = ["botscope"]
strict = false
warn_return_any = true
warn_unused_ignores = true
